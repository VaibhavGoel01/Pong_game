<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Simple Pong Game</h1>

    <div id="mainMenu">
        <div id="mainMenuText">Choose Game Mode</div>
        <button class="mainMenuBtn" data-mode="computer">User vs Computer</button>
        <button class="mainMenuBtn" data-mode="user">User vs User</button>
    </div>

    <div id="modeSelect" style="display:none;">
        <div id="selectText">Choose Game Points</div>
        <button class="modeBtn" data-score="5">5 Point Game</button>
        <button class="modeBtn" data-score="7">7 Point Game</button>
        <button class="modeBtn" data-score="11">11 Point Game</button>
    </div>
    <div id="gamePointOverlay" style="display:none;">
        GAME POINT!!
    </div>
    <div id="score" style="display:none;">
        <span id="playerScore">0</span> : <span id="aiScore">0</span>
    </div>
    <div id="message"></div>
    <button id="newGameBtn" style="display:none;">Start New Game</button>
    <canvas id="pongCanvas" width="800" height="400" style="display:none;"></canvas>
    <script src="game.js"></script>
</body>
</html>
